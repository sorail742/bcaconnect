sonar.projectKey=sorail742_bcaconnect
sonar.organization=sorail742
sonar.projectName=BCA Connect
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/e2e

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,frontend/public/**,backend/uploads/**,backend/logs/**,**/*.min.js

# Boilerplate up/down migration files are naturally repetitive — don't flag as duplication,
# but keep them in sonar.sources so the 2 known raw-SQL string-interpolation hotspots still surface.
sonar.cpd.exclusions=backend/src/migrations/**

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

sonar.javascript.environments=node,browser,jest
