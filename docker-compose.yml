services:
  # 🗄️ Base de données (Postgres)
  db:
    image: postgres:15-alpine
    container_name: bca_database
    environment:
      POSTGRES_USER: bca_user
      POSTGRES_PASSWORD: bca_password
      POSTGRES_DB: bcaconnect
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bca_user -d bcaconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ⚡ Cache & Sessions (Redis)
  redis:
    image: redis:7-alpine
    container_name: bca_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 🚀 Backend (Node.js API)
  backend:
    build: ./backend
    container_name: bca_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://bca_user:bca_password@db:5432/bcaconnect
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=d45259cf4cb572049b1c75c5ef9d0893b2bea7c3f3e8b7637d856a87530fd1df
      - ENCRYPTION_KEY=d45259cf4cb572049b1c75c5ef9d0893b2bea7c3f3e8b7637d856a87530fd1df
      # Requis par envValidation.js (validateEnv() fait échouer le démarrage
      # sinon) — non fournis en dur ici, doivent être exportés dans le shell
      # avant `docker compose up` (voir .github/workflows/load-test.yml pour
      # la génération à la volée d'une paire RSA jetable, même pattern que
      # e2e.yml/quality.yml).
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY:-gsk_ci_dummy_key_for_tests_only}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-test_webhook_secret_for_ci_only}
      - CORS_ORIGINS=http://localhost,http://localhost:3002
      - FRONTEND_URL=http://localhost:3002
      - PORT=5000
      # Désactivé par défaut (dev normal) — n'est mis à 'true' que par
      # .github/workflows/load-test.yml pour éviter que le rate limiter
      # fausse le rapport de charge k6 (voir loadtests/config/README.md).
      - LOAD_TEST_MODE=${LOAD_TEST_MODE:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 💻 Frontend (Application UI)
  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5000/api
        - VITE_SOCKET_URL=http://localhost:5000
    container_name: bca_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
