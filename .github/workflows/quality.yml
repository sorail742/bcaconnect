name: 📊 Qualité (SonarQube + Lighthouse)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  sonarqube:
    name: 🔍 SonarQube (non-bloquant — voir Phase 5 du plan de remédiation)
    runs-on: ubuntu-latest
    # Non-bloquant tant que la Phase 1 (fixes sécurité) et la baseline "New Code"
    # (Phase 5) ne sont pas en place — un gate rouge dès le jour 1 sur de la
    # dette préexistante décrédibilise le gate. À retirer une fois Phase 5 faite.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Dépendances backend
        working-directory: backend
        run: npm ci

      - name: 📦 Dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: 🧪 Coverage backend (lcov)
        working-directory: backend
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_minimum_32_characters_long_for_bca_ci
          ENCRYPTION_KEY: d45259cf4cb572049b1c75c5ef9d0893b2bea7c3f3e8b7637d856a87530fd1df
          GROQ_API_KEY: gsk_ci_dummy_key_for_tests_only
          DATABASE_URL: "sqlite::memory:"

      - name: 🧪 Coverage frontend (lcov)
        working-directory: frontend
        run: npm run test:coverage

      - name: 🔬 SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lighthouse:
    name: 🔦 Lighthouse CI
    runs-on: ubuntu-latest
    continue-on-error: true # jusqu'à ce que la Phase 2 (a11y/perf) fasse remonter les scores
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: 🏗️ Build
        working-directory: frontend
        run: npm run build

      - name: 🔦 Lighthouse CI
        working-directory: frontend
        run: npx lhci autorun
